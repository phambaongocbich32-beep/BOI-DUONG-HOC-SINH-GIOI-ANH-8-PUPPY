<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite English 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: nền navy sâu, chữ ngà, điểm nhấn vàng gold; thanh điều hướng cố định, nội dung rộng 1080px */
:root {
  --bg: #161b2e;
  --bg-2: #1b2138;
  --panel: #212843;
  --panel-2: #29314f;
  --line: rgba(201, 171, 110, .22);
  --gold: #c9ab6e;
  --gold-2: #e6d3a3;
  --ivory: #e9e4d6;
  --mute: #a5adc2;
  --ok: #7fcfaa;
  --bad: #e99b9b;
  --blue: #9bb4e8;
  --display: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ivory); font-family: var(--body);
  font-size: 16px; line-height: 1.65; min-height: 100%;
  background-image:
    radial-gradient(900px 420px at 85% -10%, rgba(201,171,110,.08), transparent 60%),
    radial-gradient(700px 400px at -10% 10%, rgba(110,135,200,.09), transparent 60%),
    linear-gradient(180deg, #181e33 0%, #161b2e 100%);
  background-attachment: fixed;
}
h1, h2, h3, h4, h5 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(2.3rem, 5.4vw, 3.9rem); line-height: 1.05; }
h2 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); color: var(--gold-2); }
h3 { font-size: 1.5rem; color: var(--gold-2); }
h4 { font-size: 1.25rem; color: var(--gold); margin: 22px 0 8px; }
h5 { font-size: 1.15rem; color: var(--gold); margin-bottom: 6px; letter-spacing: .06em; }
p { margin: 0 0 10px; }
a { color: var(--gold-2); }
em { color: var(--gold-2); font-style: italic; }
b, strong { font-weight: 600; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
button { font-family: inherit; }

/* ---------- Header ---------- */
.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: rgba(22,27,46,.9); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ivory); flex: none; }
.mark { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--gold-2); background: radial-gradient(circle at 30% 25%, rgba(217,180,106,.28), transparent 70%); }
.brand-t { line-height: 1.1; }
.brand-t b { display: block; font-family: var(--display); font-size: 1.25rem; letter-spacing: .04em; }
.brand-t small { color: var(--mute); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
.nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: var(--mute); text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; font-size: .93rem; white-space: nowrap; border: 1px solid transparent; }
.nav a:hover { color: var(--ivory); }
.nav a.on { color: #1a1304; background: linear-gradient(135deg, var(--gold-2), var(--gold)); font-weight: 600; }

main { max-width: 1120px; margin: 0 auto; padding: 32px 20px 72px; }
.foot { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; color: var(--mute); font-size: .82rem; border-top: 1px solid var(--line); padding-top: 20px; }

/* ---------- Common ---------- */
.eyebrow { color: var(--gold); text-transform: uppercase; letter-spacing: .22em; font-size: .74rem; font-weight: 600; margin-bottom: 10px; }
.rule { height: 1px; border: 0; background: linear-gradient(90deg, var(--gold), transparent); margin: 14px 0 22px; width: 160px; }
.card { background: linear-gradient(180deg, var(--panel), #1d2339); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.btn { appearance: none; border: 0; cursor: pointer; font-weight: 600; font-size: .95rem; padding: 11px 20px; border-radius: 999px; color: #1a1304; background: linear-gradient(135deg, var(--gold-2), var(--gold)); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(217,180,106,.3); }
.btn.ghost { background: transparent; color: var(--gold-2); border: 1px solid var(--gold); }
.btn.ghost:hover { background: rgba(217,180,106,.1); box-shadow: none; }
.btn.sm { padding: 7px 14px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--mute); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.tab { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--mute); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: .9rem; font-weight: 500; }
.tab:hover { color: var(--ivory); border-color: var(--gold); }
.tab.on { color: var(--gold-2); border-color: var(--gold); background: rgba(217,180,106,.14); }
.tab small { color: var(--mute); margin-left: 6px; }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 36px; align-items: center; padding: 14px 0 34px; }
.hero h1 span { color: var(--gold-2); display: block; font-style: italic; }
.hero p.lead { color: var(--mute); font-size: 1.08rem; max-width: 52ch; margin: 16px 0 24px; }
.hero-card { padding: 26px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.stat b { display: block; font-family: var(--display); font-size: 2.5rem; color: var(--gold-2); line-height: 1; }
.stat span { color: var(--mute); font-size: .82rem; }
.cd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 22px 0 40px; }
.cd-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.cd-card .num { font-family: var(--display); font-size: 5rem; line-height: .8; color: rgba(217,180,106,.2); position: absolute; right: 14px; top: 12px; font-weight: 700; }
.cd-card small { color: var(--gold); letter-spacing: .16em; text-transform: uppercase; font-weight: 600; font-size: .7rem; }
.cd-card h3 { font-size: 1.55rem; max-width: 14ch; }
.cd-card p { color: var(--mute); font-size: .92rem; margin: 0; }
.cd-card .row { margin-top: auto; padding-top: 14px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; counter-reset: s; margin: 18px 0 30px; }
.step { padding: 18px; border-left: 2px solid var(--gold); background: rgba(255,255,255,.025); border-radius: 0 12px 12px 0; }
.step b { font-family: var(--display); font-size: 1.2rem; color: var(--gold-2); display: block; }
.step span { color: var(--mute); font-size: .88rem; }
.scope { font-size: .9rem; color: var(--mute); }

/* ---------- Vocabulary ---------- */
.vtools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: rgba(255,255,255,.02); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--mute); padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: .88rem; font-weight: 500; }
.seg button.on { background: linear-gradient(135deg, var(--gold-2), var(--gold)); color: #1a1304; font-weight: 600; }
.search { background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--ivory); padding: 9px 16px; border-radius: 999px; font: inherit; font-size: .92rem; min-width: 220px; }
.search:focus { outline: none; border-color: var(--gold); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.vitem { padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.025); display: flex; flex-direction: column; gap: 2px; }
.vitem b { font-family: var(--display); font-size: 1.28rem; color: var(--gold-2); font-weight: 700; }
.vitem span { color: var(--mute); font-size: .9rem; }
.vitem.known { border-color: rgba(95,217,163,.4); }
.vcount { color: var(--mute); font-size: .88rem; }
.flash-wrap { max-width: 560px; margin: 10px auto; }
.flash { perspective: 1200px; cursor: pointer; height: 250px; }
.flash-in { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flash.flip .flash-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; border: 1px solid var(--gold); display: grid; place-items: center; text-align: center; padding: 24px; background: linear-gradient(160deg, var(--panel-2), var(--bg-2)); box-shadow: 0 14px 40px rgba(0,0,0,.35), inset 0 0 0 6px rgba(217,180,106,.06); }
.face.back { transform: rotateY(180deg); background: linear-gradient(160deg, #2c3659, var(--panel)); }
.face .w { font-family: var(--display); font-size: clamp(1.9rem, 5vw, 2.7rem); color: var(--gold-2); font-weight: 700; }
.face .t { font-size: 1.2rem; color: var(--ivory); }
.face small { display: block; color: var(--mute); margin-top: 8px; letter-spacing: .12em; text-transform: uppercase; font-size: .7rem; }
.flash-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.prog { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 14px 0; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: 99px; transition: width .4s; }
.vq { max-width: 640px; margin: 8px auto; }
.vq .qword { font-family: var(--display); font-size: 2.3rem; color: var(--gold-2); font-weight: 700; margin: 6px 0 16px; }

/* ---------- Grammar ---------- */
.g-layout { display: grid; grid-template-columns: 250px 1fr; gap: 30px; align-items: start; }
.toc { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); padding-left: 14px; max-height: calc(100vh - 110px); overflow: auto; }
.tocb { appearance: none; border: 0; background: transparent; text-align: left; font-family: inherit; cursor: pointer; color: var(--mute); font-size: .86rem; padding: 6px 8px; border-radius: 6px; line-height: 1.35; }
.tocb:hover { color: var(--gold-2); background: rgba(217,180,106,.08); }
.gsec { margin-bottom: 20px; scroll-margin-top: 88px; }
.gsec > h3 { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.gsec ul.plain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.gsec ul.plain li { padding-left: 16px; position: relative; }
.gsec ul.plain li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
.eg { color: var(--blue); font-style: italic; margin: 6px 0 6px 2px; padding-left: 12px; border-left: 2px solid rgba(134,168,255,.45); }
.eg em { color: var(--gold-2); font-weight: 600; }
.formula { margin: 12px 0; padding: 14px 18px; text-align: center; font-weight: 600; background: linear-gradient(135deg, rgba(217,180,106,.16), rgba(217,180,106,.05)); border: 1px solid var(--gold); border-radius: 12px; color: var(--gold-2); }
.formula small { font-weight: 400; color: var(--mute); }
.note { margin: 14px 0; padding: 14px 18px; background: rgba(255,255,255,.04); border-left: 3px solid var(--gold); border-radius: 0 12px 12px 0; }
.note .formula { margin: 10px 0; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.chip { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(217,180,106,.16); line-height: 1.35; }
.chip b { color: var(--gold-2); font-weight: 600; }
.chip i { color: var(--mute); font-size: .86rem; font-style: normal; }
.twocol, .threecol { display: grid; gap: 14px; margin: 10px 0; }
.twocol { grid-template-columns: repeat(2, 1fr); }
.threecol { grid-template-columns: repeat(3, 1fr); }
.mini { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.03); }
.mini.big h5 { font-size: 1.7rem; letter-spacing: .1em; }
.mini ul.plain { gap: 8px; }
.mini .eg { font-size: .92rem; }

/* ---------- Practice ---------- */
.exlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.excard { text-align: left; cursor: pointer; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, transform .2s; }
.excard:hover { border-color: var(--gold); transform: translateY(-2px); }
.excard h4 { margin: 0; color: var(--gold-2); font-size: 1.4rem; }
.excard p { color: var(--mute); font-size: .9rem; margin: 0; }
.tag { display: inline-block; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--gold); width: fit-content; }
.best { margin-top: auto; padding-top: 6px; font-size: .86rem; color: var(--mute); }
.best b { color: var(--ok); }
.special { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.special .card { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.special p { color: var(--mute); margin: 0; font-size: .92rem; }

.runhead { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.instr { color: var(--gold-2); font-weight: 500; margin: 8px 0 18px; padding: 12px 16px; border-left: 3px solid var(--gold); background: rgba(255,255,255,.03); border-radius: 0 10px 10px 0; }
.q { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid rgba(217,180,106,.14); }
.q:last-child { border-bottom: 0; }
.n { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold-2); display: grid; place-items: center; font-size: .82rem; font-weight: 600; }
.qb { flex: 1; min-width: 0; }
.qt { margin: 0 0 8px; font-size: 1.04rem; line-height: 1.9; }
.gap { display: inline-block; min-width: 62px; padding: 0 8px; text-align: center; border-bottom: 2px solid var(--gold); color: var(--gold-2); font-weight: 600; margin: 0 2px; }
.blank, .fixin, .area { font: inherit; color: var(--ivory); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.blank { width: 130px; text-align: center; font-weight: 600; color: var(--gold-2); }
.fixin { width: 100%; padding: 9px 12px; }
.area { width: 100%; padding: 14px; min-height: 270px; line-height: 1.8; resize: vertical; }
.blank:focus, .fixin:focus, .area:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,.09); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: rgba(255,255,255,.025); transition: background .15s, border-color .15s; }
.opt:hover { border-color: var(--gold); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid var(--mute); display: grid; place-items: center; font-size: .75rem; color: var(--mute); }
.opt.sel { border-color: var(--gold); background: rgba(217,180,106,.15); }
.opt.sel .l { background: var(--gold); border-color: var(--gold); color: #1a1304; font-weight: 700; }
.opt:has(input:focus-visible) { outline: 2px solid var(--gold); outline-offset: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills .opt { padding: 6px 16px; border-radius: 999px; }
.crow { align-items: center; }
.crow .w { font-family: var(--display); font-size: 1.4rem; color: var(--gold-2); min-width: 130px; font-weight: 700; }
.q.good .n { background: var(--ok); border-color: var(--ok); color: #06231a; }
.q.wrong .n { background: var(--bad); border-color: var(--bad); color: #330909; }
.q.good .blank, .q.good .fixin { border-color: var(--ok); }
.q.wrong .blank, .q.wrong .fixin { border-color: var(--bad); }
.opt.right { border-color: var(--ok); background: rgba(95,217,163,.16); }
.opt.right .l { background: var(--ok); border-color: var(--ok); color: #06231a; }
.opt.miss { border-color: var(--bad); background: rgba(255,141,141,.14); }
.opt.miss .l { background: var(--bad); border-color: var(--bad); color: #330909; }
.opt.locked { cursor: default; }
.fb { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: .92rem; border: 1px solid; }
.fb.ok { border-color: rgba(95,217,163,.4); background: rgba(95,217,163,.07); }
.fb.bad { border-color: rgba(255,141,141,.45); background: rgba(255,141,141,.07); }
.fb .fbh { font-weight: 600; margin-bottom: 2px; }
.fb.ok .fbh { color: var(--ok); }
.fb.bad .fbh { color: var(--bad); }
.fb p { margin: 2px 0; }
.fb .why { color: var(--ivory); }
.fb .why::before { content: "Giải thích: "; color: var(--gold); font-weight: 600; }
.sticky-sub { position: sticky; bottom: 0; padding: 14px 0; margin-top: 8px; background: linear-gradient(180deg, transparent, var(--bg) 40%); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; margin-bottom: 20px; border-color: var(--gold); }
.ring { width: 118px; height: 118px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--gold-2); }
.score h3 { margin-bottom: 4px; }
.score p { margin: 0 0 10px; color: var(--mute); }
.note-box { background: rgba(134,168,255,.08); border: 1px solid rgba(134,168,255,.3); padding: 10px 14px; border-radius: 10px; font-size: .88rem; color: var(--mute); margin-bottom: 16px; }
.pass-res { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

/* ---------- Progress ---------- */
.ptable { width: 100%; border-collapse: collapse; font-size: .93rem; }
.ptable th, .ptable td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(217,180,106,.14); }
.ptable th { color: var(--gold); font-weight: 600; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }
.tscroll { overflow-x: auto; }
.bars { display: grid; gap: 14px; }
.bar-l { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 4px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .cd-grid, .steps { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(2, 1fr); }
  .g-layout { grid-template-columns: 1fr; }
  .toc { position: static; flex-direction: row; flex-wrap: wrap; border-left: 0; padding-left: 0; max-height: none; gap: 6px; }
  .tocb { border: 1px solid var(--line); border-radius: 99px; }
  .special { grid-template-columns: 1fr; }
  .threecol { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .top-in { padding: 8px 14px; gap: 10px; }
  .brand-t small { display: none; }
  main { padding: 22px 16px 60px; }
  .twocol { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; }
  .score { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat b { font-size: 2rem; }
  .card { padding: 16px; }
  .crow { flex-wrap: wrap; }
  .search { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><span class="mark">E8</span><span class="brand-t"><b>Elite English 8</b><small>Bồi dưỡng học sinh giỏi</small></span></a>
    <nav class="nav" id="nav">
      <a href="#home" data-r="home">Trang chủ</a>
      <a href="#vocab" data-r="vocab">Từ vựng</a>
      <a href="#grammar" data-r="grammar">Ngữ pháp</a>
      <a href="#practice" data-r="practice">Luyện tập</a>
      <a href="#progress" data-r="progress">Tiến độ</a>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
(function () {

  const mem = {};

    get(k, d) {
      if (k in mem) return mem[k];
      try { const v = localStorage.getItem(k); if (v !== null) { mem[k] = JSON.parse(v); return mem[k]; } } catch (e) {}
      return d;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- chuẩn hoá chuỗi khi chấm ---------- */
  const norm = (s) => String(s || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”"]/g, "").replace(/[.,;!?]/g, " ").replace(/\s+/g, " ").trim();
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- dữ liệu dẫn xuất ---------- */
  const exItems = (ex) => {
    if (ex.type === "passage") return ex.errors.map((e, i) => Object.assign({}, e, { id: ex.id + ":" + i, type: "perr", no: i + 1, exId: ex.id }));
    return ex.items.map((it, i) => Object.assign({}, it, { id: ex.id + ":" + i, type: ex.type, cols: ex.cols, exId: ex.id, no: i + 1, cd: ex.cd, exTitle: ex.title }));
  };

  const totalWords = VOCAB.reduce((n, v) => n + v.items.length, 0);
  const totalSections = GRAMMAR.reduce((n, g) => n + g.sections.length, 0);

  /* ---------- trạng thái ---------- */
  const S = {
    vocab: { cat: "v4a", mode: "list", q: "", order: [], i: 0, flip: false, quiz: null },

  function renderHome() {

    const done = EXERCISES.filter((e) => sc[e.id]).length;

        const ex = EXERCISES.filter((e) => e.cd === cd);
        const q = ex.reduce((n, e) => n + (e.type === "passage" ? e.errors.length : e.items.length), 0);
        return `<div class="card cd-card"><span class="num">${cd}</span><small>Chuyên đề ${cd}</small><h3>${CD_META[cd].vi}</h3><p>${CD_META[cd].en}</p><p>${wc} mục từ vựng · ${ex.length} bài tập · ${q} câu</p>
          <div class="row"><button class="btn sm" data-act="goGrammar" data-cd="${cd}">Ngữ pháp</button><button class="btn sm ghost" data-act="goPractice" data-cd="${cd}">Làm bài</button></div></div>`;
      }).join("")}
    </div>

    <div class="eyebrow">Cách học gợi ý</div>
    <div class="steps">
      <div class="step"><b>1. Từ vựng</b><span>Xem danh sách, lật thẻ ghi nhớ, rồi tự kiểm tra.</span></div>
      <div class="step"><b>2. Ngữ pháp</b><span>Đọc công thức, ví dụ và các chú ý của từng chuyên đề.</span></div>
      <div class="step"><b>3. Luyện tập</b><span>Làm hết bài rồi nhấn nộp để được chấm.</span></div>
      <div class="step"><b>4. Ôn câu sai</b><span>Làm lại riêng các câu đã sai và thử thách tổng hợp.</span></div>
    </div>
    <p class="scope">Phạm vi: các trang của sách được cung cấp gồm Chuyên đề 4 (trang 18–19, 22–27), Chuyên đề 5 (trang 28–31) và Chuyên đề 6 (trang 32–35). Phần đáp án của Bài 4 và Bài 5 chuyên đề 6 bị cắt khỏi bản scan, nên đáp án hai bài này do hệ thống bổ sung và có ghi chú ngay trong bài.</p>`;
  }

  /* ======================================================= VOCAB */
  const vocabPool = (cat) => (cat === "all" ? VOCAB.flatMap((v) => v.items.map((i) => ({ en: i[0], vi: i[1], cat: v.id }))) : VOCAB.find((v) => v.id === cat).items.map((i) => ({ en: i[0], vi: i[1], cat })));
  const known = () => store.get("e8_known", {});
  const kKey = (w) => w.cat + "|" + w.en;

  function renderVocab() {
    const V = S.vocab;
    const pool = vocabPool(V.cat);
    const kn = known();
    const knCount = pool.filter((w) => kn[kKey(w)]).length;
    const cur = V.cat === "all" ? { name: "Tất cả", hint: "Toàn bộ từ vựng của ba chuyên đề" } : VOCAB.find((v) => v.id === V.cat);
    let body = "";
    if (V.mode === "list") body = `<div class="vtools"><input class="search" id="vsearch" placeholder="Tìm từ hoặc nghĩa…" value="${esc(V.q)}" aria-label="Tìm từ vựng"><span class="vcount" id="vcount"></span></div><div class="vgrid" id="vgrid"></div>`;
    if (V.mode === "cards") body = cardsHTML(pool, kn);
    if (V.mode === "quiz") body = quizHTML();
    app.innerHTML = `
      <div class="eyebrow">Vocabulary</div><h2>Từ vựng theo chuyên đề</h2><hr class="rule">
      <div class="tabs" role="tablist">
        ${[["all", "Tất cả", totalWords]].concat(VOCAB.map((v) => [v.id, "CĐ" + v.cd + " · " + v.name, v.items.length])).map((t) => `<button class="tab ${V.cat === t[0] ? "on" : ""}" data-act="vcat" data-id="${t[0]}">${esc(t[1])}<small>${t[2]}</small></button>`).join("")}
      </div>
      <div class="card">
        <div class="vtools"><div><h3 style="margin-bottom:2px">${esc(cur.name)}</h3><div class="muted" style="font-size:.9rem">${esc(cur.hint)} · đã thuộc ${knCount}/${pool.length}</div></div>
          <div class="seg"><button class="${V.mode === "list" ? "on" : ""}" data-act="vmode" data-m="list">Danh sách</button><button class="${V.mode === "cards" ? "on" : ""}" data-act="vmode" data-m="cards">Thẻ ghi nhớ</button><button class="${V.mode === "quiz" ? "on" : ""}" data-act="vmode" data-m="quiz">Kiểm tra</button></div></div>
        ${body}
      </div>`;
    if (V.mode === "list") fillVgrid();
  }
  function fillVgrid() {
    const V = S.vocab, kn = known(), q = V.q.trim().toLowerCase();
    const list = vocabPool(V.cat).filter((w) => !q || w.en.toLowerCase().includes(q) || w.vi.toLowerCase().includes(q));
    $("#vgrid").innerHTML = list.map((w) => `<div class="vitem ${kn[kKey(w)] ? "known" : ""}"><b>${esc(w.en)}</b><span>${esc(w.vi)}</span></div>`).join("") || `<p class="muted">Không tìm thấy từ phù hợp.</p>`;
    $("#vcount").textContent = list.length + " mục";
  }
  function ensureOrder(pool) {
    const V = S.vocab;
    if (V.order.length !== pool.length) { V.order = pool.map((_, i) => i); V.i = 0; V.flip = false; }
  }
  function cardsHTML(pool, kn) {
    const V = S.vocab; ensureOrder(pool);
    const w = pool[V.order[V.i]];
    const isK = !!kn[kKey(w)];
    return `<div class="flash-wrap">
      <div class="vcount" style="text-align:center">Thẻ ${V.i + 1}/${pool.length} · bấm vào thẻ hoặc phím Space để lật</div>
      <div class="prog"><i style="width:${((V.i + 1) / pool.length) * 100}%"></i></div>
      <div class="flash ${V.flip ? "flip" : ""}" data-act="flip" tabindex="0" role="button" aria-label="Lật thẻ">
        <div class="flash-in"><div class="face"><div><div class="w">${esc(w.en)}</div><small>Tiếng Anh</small></div></div><div class="face back"><div><div class="t">${esc(w.vi)}</div><small>${esc(w.en)}</small></div></div></div>
      </div>
      <div class="flash-bar">
        <button class="btn ghost sm" data-act="cprev">← Trước</button>
        <button class="btn sm ${isK ? "ghost" : ""}" data-act="cknow">${isK ? "Bỏ đánh dấu thuộc" : "Đã thuộc ✓"}</button>
        <button class="btn ghost sm" data-act="cnext">Sau →</button>
        <button class="btn ghost sm" data-act="cshuf">Xáo trộn</button>
      </div></div>`;
  }
  function buildQuiz() {
    const V = S.vocab, pool = vocabPool(V.cat), all = vocabPool("all");
    const picks = shuffle(pool).slice(0, Math.min(10, pool.length));
    const qs = picks.map((w) => {
      const same = pool.filter((x) => x.vi !== w.vi);
      const src = same.length >= 3 ? same : all.filter((x) => x.vi !== w.vi);
      const ds = shuffle(Array.from(new Set(src.map((x) => x.vi)))).slice(0, 3);
      const opts = shuffle(ds.concat([w.vi]));
      return { en: w.en, vi: w.vi, opts, ai: opts.indexOf(w.vi) };
    });
    V.quiz = { qs, i: 0, score: 0, picked: null, wrong: [] };
  }
  function quizHTML() {
    const V = S.vocab;
    if (!V.quiz) return `<div style="text-align:center;padding:30px 10px"><p class="muted">Chọn nghĩa đúng của 10 từ ngẫu nhiên trong mục đang chọn.</p><button class="btn" data-act="qstart">Bắt đầu kiểm tra</button></div>`;
    const Q = V.quiz;
    if (Q.i >= Q.qs.length) {
      return `<div class="vq" style="text-align:center"><h3>Kết quả: ${Q.score}/${Q.qs.length}</h3><p class="muted">${Q.score === Q.qs.length ? "Tuyệt vời, bạn nhớ hết các từ này." : "Xem lại các từ bạn chọn sai bên dưới."}</p>
        ${Q.wrong.length ? `<div class="vgrid" style="text-align:left;margin:16px 0">${Q.wrong.map((w) => `<div class="vitem"><b>${esc(w.en)}</b><span>${esc(w.vi)}</span></div>`).join("")}</div>` : ""}
        <button class="btn" data-act="qstart">Kiểm tra lại</button></div>`;
    }
    const q = Q.qs[Q.i];
    return `<div class="vq"><div class="vcount">Câu ${Q.i + 1}/${Q.qs.length} · Điểm ${Q.score}</div><div class="prog"><i style="width:${(Q.i / Q.qs.length) * 100}%"></i></div>
      <div class="qword">${esc(q.en)}</div><div class="opts" style="grid-template-columns:1fr">
      ${q.opts.map((o, i) => { let c = ""; if (Q.picked !== null) { if (i === q.ai) c = "right"; else if (i === Q.picked) c = "miss"; c += " locked"; } return `<button class="opt ${c}" data-act="qpick" data-i="${i}" style="text-align:left;color:inherit;font:inherit"><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
      ${Q.picked !== null ? `<div style="margin-top:16px"><button class="btn" data-act="qnext">${Q.i + 1 === Q.qs.length ? "Xem kết quả" : "Câu tiếp theo →"}</button></div>` : ""}</div>`;
  }

  /* ======================================================= GRAMMAR */
  function renderGrammar() {
    const cd = S.grammar.cd, g = GRAMMAR.find((x) => x.cd === cd);
    app.innerHTML = `
      <div class="eyebrow">Grammar</div><h2>Ngữ pháp theo chuyên đề</h2><hr class="rule">
      <div class="tabs">${GRAMMAR.map((x) => `<button class="tab ${x.cd === cd ? "on" : ""}" data-act="gcd" data-cd="${x.cd}">Chuyên đề ${x.cd} · ${x.vi}</button>`).join("")}</div>
      <div class="g-layout">
        <nav class="toc" aria-label="Mục lục">${g.sections.map((s) => `<button class="tocb" data-act="gjump" data-id="${s.id}">${s.title}</button>`).join("")}</nav>
        <div>
          <div class="card gsec"><div class="eyebrow">Chuyên đề ${g.cd} · ${g.en}</div><h3 style="font-size:2rem">${g.vi}</h3><p class="muted" style="margin-top:8px">${g.intro}</p></div>
          ${g.sections.map((s) => `<section class="card gsec" id="${s.id}"><h3>${s.title}</h3>${s.html}</section>`).join("")}
          <div class="card row" style="justify-content:space-between"><div><h3>Đã đọc xong chuyên đề ${g.cd}?</h3><span class="muted">Làm bài tập để kiểm tra mức độ nhớ.</span></div><button class="btn" data-act="goPractice" data-cd="${g.cd}">Luyện tập chuyên đề ${g.cd}</button></div>
        </div>
      </div>`;
  }

  /* ======================================================= PRACTICE */
  const typeLabel = { classify: "Phân loại", fill: "Điền từ", mcq: "Trắc nghiệm", pick: "Chọn đáp án", fix: "Sửa lỗi", passage: "Sửa đoạn văn" };
  function renderPractice() {
    const P = S.practice;
    if (P.run) return renderRun();
    const sc = store.get("e8_scores", {});
    const wrong = store.get("e8_wrong", []).filter((id) => ITEM_INDEX[id]);
    const list = EXERCISES.filter((e) => e.cd === P.cd);
    app.innerHTML = `
      <div class="eyebrow">Practice</div><h2>Luyện tập và chấm bài</h2><hr class="rule">
      <div class="special">
        <div class="card"><h3>Thử thách tổng hợp</h3><p>20 câu ngẫu nhiên từ cả ba chuyên đề. Phù hợp để tự kiểm tra trước buổi thi.</p>${sc.mix ? `<p>Điểm cao nhất: <b style="color:var(--ok)">${sc.mix.best}%</b></p>` : ""}<button class="btn" data-act="startMix">Bắt đầu 20 câu</button></div>
        <div class="card"><h3>Ôn lại câu sai</h3><p>${wrong.length ? `Bạn đang có <b style="color:var(--gold-2)">${wrong.length}</b> câu đã làm sai. Làm lại để xóa chúng khỏi danh sách.` : "Chưa có câu sai nào được ghi lại. Làm bài tập trước, các câu sai sẽ xuất hiện ở đây."}</p><button class="btn ${wrong.length ? "" : "ghost"}" data-act="startReview" ${wrong.length ? "" : "disabled"}>Ôn ${wrong.length} câu sai</button></div>
      </div>
      <div class="tabs">${[4, 5, 6].map((cd) => `<button class="tab ${cd === P.cd ? "on" : ""}" data-act="pcd" data-cd="${cd}">Chuyên đề ${cd} · ${CD_META[cd].vi}</button>`).join("")}</div>
      <div class="exlist">
        ${list.map((e) => {
          const n = e.type === "passage" ? e.errors.length : e.items.length, s = sc[e.id];
          return `<button class="card excard" data-act="openEx" data-id="${e.id}"><span class="tag">${typeLabel[e.type]} · ${n} ${e.type === "passage" ? "lỗi" : "câu"}</span><h4>${e.title}</h4><p>${esc(e.instr.split(". ")[0].replace(/\.$/, ""))}</p><div class="best">${s ? `Điểm cao nhất <b>${s.best}%</b> · đã làm ${s.n} lần` : "Chưa làm"}</div></button>`;
        }).join("")}
      </div>`;
  }

  function makeRun(kind, ex) {
    if (kind === "ex") {
      return { kind, ex, exId: ex.id, cd: ex.cd, title: "Chuyên đề " + ex.cd + " · " + ex.title, instr: ex.instr, note: ex.note, items: exItems(ex), passage: ex.type === "passage" ? ex : null, graded: false, answers: {}, results: {}, onlyWrong: false };
    }
    let items;
    if (kind === "mix") {
      const pool = Object.values(ITEM_INDEX).filter((it) => it.type === "mcq" || it.type === "pick" || it.type === "fill");
      items = shuffle(pool).slice(0, 20);
    } else {
      const ids = store.get("e8_wrong", []).filter((id) => ITEM_INDEX[id]);
      items = ids.map((id) => ITEM_INDEX[id]);
    }
    return { kind, exId: kind, title: kind === "mix" ? "Thử thách tổng hợp" : "Ôn lại câu sai", instr: kind === "mix" ? "20 câu ngẫu nhiên từ ba chuyên đề. Chọn hoặc điền đáp án rồi nhấn nộp bài." : "Làm lại các câu bạn từng sai. Câu đúng sẽ được xóa khỏi danh sách.", items, graded: false, answers: {}, results: {}, onlyWrong: false };
  }

  function itemHTML(it, run, n) {
    const g = run.graded, r = run.results[it.id], a = run.answers[it.id];
    const cls = g ? (r.ok ? "good" : "wrong") : "";
    const src = run.kind !== "ex" ? `<div class="muted" style="font-size:.75rem;letter-spacing:.08em;text-transform:uppercase">CĐ${it.cd} · ${it.exTitle}</div>` : "";
    const dis = g ? "disabled" : "";
    const optHTML = (o, i, letters) => {
      let c = "opt";
      const picked = a !== undefined && a !== "" && +a === i;
      if (g) { c += " locked"; if (i === it.a || (r.ok && picked)) c += " right"; else if (picked) c += " miss"; }
      else if (picked) c += " sel";
      return `<label class="${c}"><input type="radio" name="r_${it.id}" value="${i}" ${picked ? "checked" : ""} ${dis}>${letters ? `<span class="l">${L[i]}</span>` : ""}<span>${esc(o)}</span></label>`;
    };
    let main = "";
    if (it.type === "classify") {
      main = `<div class="pills">${it.cols.map((c) => { let k = "opt"; const picked = a === c; if (g) { k += " locked"; if (c === it.a) k += " right"; else if (picked) k += " miss"; } else if (picked) k += " sel"; return `<label class="${k}"><input type="radio" name="r_${it.id}" value="${esc(c)}" ${picked ? "checked" : ""} ${dis}><span>${esc(c)}</span></label>`; }).join("")}</div>`;
      return `<div class="q crow ${cls}"><span class="n">${n}</span><div class="qb" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><span class="w" style="font-family:var(--display);font-size:1.5rem;color:var(--gold-2);font-weight:700;min-width:120px">${esc(it.t)}</span>${main}</div>${""}</div>${g ? fbHTML(it, r, true) : ""}`;
    }
    if (it.type === "fill") {
      const parts = it.q.split("___");
      main = `<p class="qt">${esc(parts[0])}<input class="blank" data-id="${it.id}" value="${esc(a || "")}" ${dis} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu ${n}">${esc(parts[1] || "")}</p>`;
    } else if (it.type === "mcq" || it.type === "pick") {
      const parts = it.q.split("___");
      const chosen = a !== undefined && a !== "" ? it.o[+a] : "";
      main = `<p class="qt">${esc(parts[0])}<span class="gap" data-gap="${it.id}">${chosen ? esc(chosen) : "&nbsp;"}</span>${esc(parts[1] || "")}</p><div class="${it.type === "mcq" ? "opts" : "pills"}">${it.o.map((o, i) => optHTML(o, i, it.type === "mcq")).join("")}</div>`;
    } else if (it.type === "fix") {
      main = `<p class="qt" style="margin-bottom:6px">Sửa câu sau nếu có lỗi:</p><input class="fixin" data-id="${it.id}" value="${esc(a !== undefined ? a : it.q)}" ${dis} spellcheck="false" aria-label="Câu ${n}">`;
    }
    return `<div class="q ${cls}"><span class="n">${n}</span><div class="qb">${src}${main}${g ? fbHTML(it, r) : ""}</div></div>`;
  }
  function fbHTML(it, r, outside) {
    const head = r.ok ? (r.altUsed ? "✓ Chính xác (đáp án khác cũng được chấp nhận)" : "✓ Chính xác") : r.unanswered ? "✗ Chưa trả lời" : "✗ Chưa đúng";
    let lines = "";
    if (!r.ok) {
      if (it.type === "fix") lines += `<p>Bạn viết: <i>${esc(r.shown)}</i></p><p>Câu đúng: <b>${esc(r.correct)}</b></p>`;
      else lines += `<p>Đáp án đúng: <b>${esc(r.correct)}</b>${r.shown ? ` · Bạn chọn: ${esc(r.shown)}` : ""}</p>`;
    } else if (r.altUsed) lines += `<p>Đáp án trong sách: <b>${esc(r.correct)}</b></p>`;
    if (it.type === "fix") lines += `<p>Lỗi sai: <b>${esc(it.key)}</b></p>`;
    const box = `<div class="fb ${r.ok ? "ok" : "bad"}"><div class="fbh">${head}</div>${lines}<p class="why">${esc(it.why)}</p></div>`;
    return outside ? `<div style="padding:0 0 14px 44px;border-bottom:1px solid rgba(217,180,106,.14)">${box}</div>` : box;
  }

  function renderRun() {
    const run = S.practice.run, g = run.graded;
    const n = run.items.length;
    let correct = 0; if (g) correct = run.items.filter((it) => run.results[it.id].ok).length;
    const pct = g ? Math.round((correct / n) * 100) : 0;
    let verdict = "";
    if (g) verdict = pct >= 90 ? "Xuất sắc" : pct >= 75 ? "Giỏi" : pct >= 50 ? "Khá, cần ôn thêm" : "Cần ôn lại lý thuyết";
    const circ = 2 * Math.PI * 52;
    const score = g ? `<div class="card score"><div class="ring"><svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle cx="59" cy="59" r="52" fill="none" stroke="${pct >= 75 ? "var(--ok)" : pct >= 50 ? "var(--gold)" : "var(--bad)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(pct / 100) * circ} ${circ}"/></svg><div class="pct">${pct}%</div></div>
      <div><h3>${verdict}</h3><p>Đúng ${correct}/${n} ${run.passage ? "lỗi" : "câu"}. ${pct < 75 && run.cd ? "Đọc lại phần ngữ pháp của chuyên đề rồi làm lại để cải thiện." : "Xem giải thích từng câu bên dưới."}</p>
      <div class="row"><button class="btn sm" data-act="retry">Làm lại bài này</button>${run.cd ? `<button class="btn sm ghost" data-act="goGrammar" data-cd="${run.cd}">Xem ngữ pháp</button>` : ""}<button class="btn sm ghost" data-act="toggleWrong">${run.onlyWrong ? "Hiện tất cả câu" : "Chỉ hiện câu sai"}</button><button class="btn sm ghost" data-act="backList">Về danh sách bài</button></div></div></div>` : "";

    let body = "";
    if (run.passage) {
      const t = run.answers.passage !== undefined ? run.answers.passage : run.passage.text;
      body = `<div class="card"><textarea class="area" id="area" ${g ? "disabled" : ""} spellcheck="false" aria-label="Đoạn văn cần sửa">${esc(t)}</textarea>
        ${g ? `<div class="pass-res">${run.items.map((it, i) => { const r = run.results[it.id]; return `<div class="fb ${r.ok ? "ok" : "bad"}"><div class="fbh">${r.ok ? "✓" : "✗"} Lỗi ${i + 1}: ${esc(it.wrong)} → ${esc(it.right)}</div><p class="why">${esc(it.why)}</p></div>`; }).join("")}</div>` : `<p class="muted" style="margin:10px 0 0;font-size:.88rem">Đoạn văn có 6 lỗi giới từ. Sửa trực tiếp trong khung rồi nhấn nộp bài.</p>`}</div>`;
    } else {
      const items = run.items.map((it, i) => ({ it, i }));
      const shown = g && run.onlyWrong ? items.filter((x) => !run.results[x.it.id].ok) : items;
      body = `<div class="card" style="padding-top:6px;padding-bottom:6px">${shown.length ? shown.map((x) => itemHTML(x.it, run, x.i + 1)).join("") : `<p style="padding:20px 0">Không có câu sai nào. Bạn làm đúng hết.</p>`}</div>`;
    }
    app.innerHTML = `
      <div class="runhead"><div><div class="eyebrow">${run.kind === "ex" ? "Bài tập" : "Luyện tập"}</div><h2>${esc(run.title)}</h2></div><button class="btn ghost sm" data-act="backList">← Danh sách bài</button></div>
      <div class="instr">${esc(run.instr)}</div>
      ${run.note ? `<div class="note-box">${esc(run.note)}</div>` : ""}
      ${score}${body}
      ${g ? "" : `<div class="sticky-sub"><button class="btn" data-act="submit">Nộp bài và chấm điểm</button><span class="muted" style="font-size:.88rem">Bạn có thể nộp khi chưa làm hết, câu bỏ trống tính là sai.</span></div>`}`;
  }

  function collect(run) {
    if (run.passage) { run.answers.passage = $("#area").value; return; }
    run.items.forEach((it) => {
      if (it.type === "fill" || it.type === "fix") { const el = $('[data-id="' + it.id + '"]'); run.answers[it.id] = el ? el.value : ""; }
      else { const el = $('input[name="r_' + it.id + '"]:checked'); run.answers[it.id] = el ? el.value : ""; }
    });
  }
  function gradeItem(it, val) {
    const v = val === undefined ? "" : val;
    if (it.type === "classify") return { ok: v === it.a, unanswered: v === "", shown: v, correct: it.a };
    if (it.type === "fill") return { ok: it.a.some((x) => norm(x) === norm(v)), unanswered: norm(v) === "", shown: v, correct: it.a[0] };
    if (it.type === "fix") { const ok = it.a.some((x) => norm(x) === norm(v)); return { ok, unanswered: false, shown: v, correct: it.a[0] }; }
    const un = v === "", i = un ? -1 : +v;
    const alt = (it.alt || []).includes(i);
    return { ok: i === it.a || alt, altUsed: alt && i !== it.a, unanswered: un, shown: un ? "" : it.o[i], correct: it.o[it.a] };
  }
  function submitRun() {
    const run = S.practice.run;
    collect(run);
    if (run.passage) {
      const t = norm(run.answers.passage);
      run.items.forEach((it) => { run.results[it.id] = { ok: !!it.test(t) }; });
    } else run.items.forEach((it) => { run.results[it.id] = gradeItem(it, run.answers[it.id]); });
    run.graded = true;
    const total = run.items.length, c = run.items.filter((it) => run.results[it.id].ok).length;
    const sc = store.get("e8_scores", {}), key = run.exId, o = sc[key] || { best: 0, n: 0 }, pct = Math.round((c / total) * 100);
    sc[key] = { best: Math.max(o.best, pct), last: pct, n: o.n + 1, c, t: total, at: Date.now() };
    store.set("e8_scores", sc);
    let wrong = new Set(store.get("e8_wrong", []));
    run.items.forEach((it) => { if (ITEM_INDEX[it.id]) { if (run.results[it.id].ok) wrong.delete(it.id); else wrong.add(it.id); } });
    store.set("e8_wrong", Array.from(wrong));
    renderRun(); window.scrollTo(0, 0);
  }

  /* ======================================================= PROGRESS */
  function renderProgress() {
    const sc = store.get("e8_scores", {});
    const done = EXERCISES.filter((e) => sc[e.id]);
    const avg = done.length ? Math.round(done.reduce((s, e) => s + sc[e.id].best, 0) / done.length) : 0;
    const kn = Object.keys(known()).length;
    const wrong = store.get("e8_wrong", []).filter((id) => ITEM_INDEX[id]).length;
    app.innerHTML = `
      <div class="eyebrow">Progress</div><h2>Tiến độ học tập</h2><hr class="rule">
      <div class="card hero-card" style="margin-bottom:20px"><div class="stats">
        <div class="stat"><b>${done.length}/${EXERCISES.length}</b><span>bài đã làm</span></div>
        <div class="stat"><b>${done.length ? avg + "%" : "–"}</b><span>điểm cao nhất trung bình</span></div>
        <div class="stat"><b>${kn}/${totalWords}</b><span>từ đã thuộc</span></div></div></div>
      <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:14px">Theo chuyên đề</h3><div class="bars">
        ${[4, 5, 6].map((cd) => { const ex = EXERCISES.filter((e) => e.cd === cd), d = ex.filter((e) => sc[e.id]); const a = d.length ? Math.round(d.reduce((s, e) => s + sc[e.id].best, 0) / d.length) : 0; return `<div><div class="bar-l"><span>Chuyên đề ${cd} · ${CD_META[cd].vi}</span><span class="muted">${d.length}/${ex.length} bài · ${d.length ? a + "%" : "chưa làm"}</span></div><div class="prog"><i style="width:${(d.length / ex.length) * 100}%"></i></div></div>`; }).join("")}</div></div>
      <div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:10px">Kết quả từng bài</h3><div class="tscroll"><table class="ptable"><thead><tr><th>Bài</th><th>Dạng</th><th>Lần gần nhất</th><th>Cao nhất</th><th>Số lần</th></tr></thead><tbody>
        ${EXERCISES.map((e) => { const s = sc[e.id]; return `<tr><td>CĐ${e.cd} · ${e.title}</td><td>${typeLabel[e.type]}</td><td>${s ? s.last + "%" : "–"}</td><td>${s ? "<b style='color:var(--ok)'>" + s.best + "%</b>" : "–"}</td><td>${s ? s.n : 0}</td></tr>`; }).join("")}
      </tbody></table></div></div>
      <div class="row"><button class="btn" data-act="startReview" ${wrong ? "" : "disabled"}>Ôn lại ${wrong} câu sai</button><button class="btn ghost" data-act="resetAll" id="resetBtn">Xóa toàn bộ tiến độ</button></div>`;
  }

  /* ======================================================= SỰ KIỆN */
  const A = {
    goGrammar(t) { S.grammar.cd = +t.dataset.cd; location.hash === "#grammar" ? route() : (location.hash = "#grammar"); },
    goPractice(t) { S.practice.cd = +t.dataset.cd; S.practice.run = null; location.hash === "#practice" ? route() : (location.hash = "#practice"); },
    vcat(t) { S.vocab.cat = t.dataset.id; S.vocab.order = []; S.vocab.quiz = null; S.vocab.q = ""; route(true); },
    vmode(t) { S.vocab.mode = t.dataset.m; S.vocab.flip = false; if (t.dataset.m === "quiz") S.vocab.quiz = null; route(true); },
    flip() { S.vocab.flip = !S.vocab.flip; const f = $(".flash"); if (f) f.classList.toggle("flip", S.vocab.flip); },
    cnext() { const V = S.vocab; V.i = (V.i + 1) % V.order.length; V.flip = false; route(true); },
    cprev() { const V = S.vocab; V.i = (V.i - 1 + V.order.length) % V.order.length; V.flip = false; route(true); },
    cshuf() { const V = S.vocab; V.order = shuffle(V.order); V.i = 0; V.flip = false; route(true); },
    cknow() { const V = S.vocab, w = vocabPool(V.cat)[V.order[V.i]], kn = Object.assign({}, known()); if (kn[kKey(w)]) delete kn[kKey(w)]; else kn[kKey(w)] = 1; store.set("e8_known", kn); if (kn[kKey(w)] && V.i < V.order.length - 1) { V.i++; V.flip = false; } route(true); },
    qstart() { buildQuiz(); route(true); },
    qpick(t) { const Q = S.vocab.quiz; if (Q.picked !== null) return; Q.picked = +t.dataset.i; const q = Q.qs[Q.i]; if (Q.picked === q.ai) Q.score++; else Q.wrong.push(q); route(true); },
    qnext() { const Q = S.vocab.quiz; Q.i++; Q.picked = null; route(true); },
    gcd(t) { S.grammar.cd = +t.dataset.cd; route(); },
    gjump(t) { const el = document.getElementById(t.dataset.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); },
    pcd(t) { S.practice.cd = +t.dataset.cd; route(true); },
    openEx(t) { S.practice.run = makeRun("ex", EXERCISES.find((e) => e.id === t.dataset.id)); route(); },
    startMix() { S.practice.run = makeRun("mix"); location.hash === "#practice" ? route() : (location.hash = "#practice"); },
    startReview() { const r = makeRun("review"); if (!r.items.length) return; S.practice.run = r; location.hash === "#practice" ? route() : (location.hash = "#practice"); },
    submit() { submitRun(); },
    retry() { const r = S.practice.run; S.practice.run = r.kind === "ex" ? makeRun("ex", r.ex) : makeRun(r.kind); route(); },
    backList() { S.practice.run = null; route(); },
    toggleWrong() { S.practice.run.onlyWrong = !S.practice.run.onlyWrong; renderRun(); },
    resetAll(t) {
      if (!t.dataset.sure) { t.dataset.sure = "1"; t.textContent = "Nhấn lần nữa để xác nhận xóa"; return; }
      ["e8_scores", "e8_wrong", "e8_known"].forEach((k) => store.set(k, k === "e8_wrong" ? [] : {}));
      route(true);
    }
  };
  const L = ["A", "B", "C", "D"];
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (t && A[t.dataset.act]) { e.preventDefault(); A[t.dataset.act](t, e); }
  });
  document.addEventListener("change", (e) => {
    const inp = e.target;
    if (inp.matches && inp.matches('.opt input[type="radio"]')) {
      $$('input[name="' + inp.name + '"]').forEach((r) => r.closest(".opt").classList.toggle("sel", r.checked));
      const id = inp.name.slice(2), gap = $('[data-gap="' + id + '"]');
      if (gap) { const lab = inp.closest(".opt").querySelector("span:last-child"); gap.textContent = lab ? lab.textContent : ""; }
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "vsearch") { S.vocab.q = e.target.value; fillVgrid(); }
  });
  document.addEventListener("keydown", (e) => {
    if (current() !== "vocab" || S.vocab.mode !== "cards") return;
    if (e.target.matches && e.target.matches("input,textarea")) return;
    if (e.key === "ArrowRight") A.cnext();
    else if (e.key === "ArrowLeft") A.cprev();
    else if (e.key === " " || e.key === "Enter") { if (e.target.closest && e.target.closest("button,a")) return; e.preventDefault(); A.flip(); }
  });

  route(true);
})();

</script>
</body>
